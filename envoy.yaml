static_resources:

  listeners:
    - name: listener_0
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: echo_backend
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: echo_server
                http_filters:
                  # ── Lua-Filter ────────────────────────────────────────────
                  - name: envoy.filters.http.lua
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                      inline_code: |
                        function envoy_on_request(request_handle)
                          local body = request_handle:body()
                          if body ~= nil and body:length() > 0 then
                            local content = body:getBytes(0, body:length())

                            -- Werte von a und b verdoppeln
                            local new_body = content:gsub("([ab])=(%d+)", function(key, val)
                              return key .. "=" .. tostring(tonumber(val) * 2)
                            end)

                            body:setBytes(new_body)
                            request_handle:headers():replace("content-length", tostring(#new_body))
                          end
                        end

                        function envoy_on_response(response_handle)
                          response_handle:headers():add("x-via-envoy", "true")
                        end
                  # ──────────────────────────────────────────────────────────
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: echo_server
      connect_timeout: 0.25s
      type: STRICT_DNS
      dns_lookup_family: V4_ONLY
      load_assignment:
        cluster_name: echo_server
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      # host.docker.internal zeigt auf den Host (macOS Docker Desktop)
                      address: host.docker.internal
                      port_value: 8080

# Envoy Admin-Interface (Statistiken, Config-Dump, etc.)
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
